name: CI

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "android/**"
      - "browser/**"
      - "data/**"
      - "mods/**"
      - "modules/**"
      - "tools/**"
      - "vc18/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "overlay-ports/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Dockerfile"
      - "Dockerfile.browser"
      - "Dockerfile.browser.sh"
      - "build_luajit_android.sh"
      - "setup_android_deps.sh"
      - "init.lua"
      - "otclientrc.lua"
      - "cacert.pem"
      - "config.ini"
      - ".dockerignore"
      - ".yamllint.yaml"
      - ".reviewdog.yml"
      - ".github/workflows/**"
  merge_group:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "android/**"
      - "browser/**"
      - "data/**"
      - "mods/**"
      - "modules/**"
      - "tools/**"
      - "vc18/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "overlay-ports/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Dockerfile"
      - "Dockerfile.browser"
      - "Dockerfile.browser.sh"
      - "build_luajit_android.sh"
      - "setup_android_deps.sh"
      - "init.lua"
      - "otclientrc.lua"
      - "cacert.pem"
      - "config.ini"
      - ".dockerignore"
      - ".yamllint.yaml"
      - ".reviewdog.yml"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      compile: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.compile }}
      macos: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.macos }}
      android: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.android }}
      docker: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.docker }}
      browser: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.browser }}
    steps:
      - name: Checkout repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          fetch-depth: 0
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            compile:
              - "src/**"
              - "tests/**"
              - "cmake/**"
              - "vc18/**"
              - "vcpkg.json"
              - "vcpkg-configuration.json"
              - "overlay-ports/**"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".yamllint.yaml"
              - ".reviewdog.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-linux.yml"
              - ".github/workflows/reusable-build-windows.yml"
              - ".github/workflows/reusable-checks.yml"
              - ".github/workflows/reusable-tests-lua.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"
            macos:
              - "src/**"
              - "cmake/**"
              - "vcpkg.json"
              - "vcpkg-configuration.json"
              - "overlay-ports/**"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-macos.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"
            android:
              - "src/**"
              - "android/**"
              - "cmake/**"
              - "CMakeLists.txt"
              - "vcpkg.json"
              - "vcpkg-configuration.json"
              - "overlay-ports/**"
              - "build_luajit_android.sh"
              - "setup_android_deps.sh"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-android-apk.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "src/**"
              - "cmake/**"
              - "vcpkg.json"
              - "vcpkg-configuration.json"
              - "overlay-ports/**"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".yamllint.yaml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-docker.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"
            browser:
              - "Dockerfile.browser"
              - "Dockerfile.browser.sh"
              - "browser/**"
              - "src/**"
              - "cmake/**"
              - "vcpkg.json"
              - "vcpkg-configuration.json"
              - "overlay-ports/**"
              - "CMakeLists.txt"
              - ".yamllint.yaml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-browser.yml"
              - ".github/workflows/update_vcpkg_baseline.yml"

  checks:
    name: Fast Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      checks: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/reusable-checks.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  tests-lua:
    name: Lua Syntax
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-tests-lua.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  build-linux:
    name: Build - Linux
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  build-android-apk:
    name: Build - Android APK
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.android == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/reusable-build-android-apk.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  build-docker:
    name: Build - Docker
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.docker == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-docker.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      vcpkg_binary_cache_access: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'readwrite' || 'read' }}
    secrets: inherit

  build-browser:
    name: Build - Browser
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.browser == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-build-browser.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit
