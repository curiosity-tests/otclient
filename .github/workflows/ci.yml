name: CI

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - "src/**"
    - "tests/**"
    - "cmake/**"
    - "android/**"
    - "browser/**"
    - "data/**"
    - "mods/**"
    - "modules/**"
    - "tools/**"
    - "vc18/**"
    - "vcpkg.json"
    - "vcpkg-configuration.json"
    - "overlay-ports/**"
    - "CMakeLists.txt"
    - "CMakePresets.json"
    - "Dockerfile"
    - "Dockerfile.browser"
    - "Dockerfile.browser.sh"
    - "build_luajit_android.sh"
    - "setup_android_deps.sh"
    - "init.lua"
    - "otclientrc.lua"
    - "cacert.pem"
    - "config.ini"
    - ".dockerignore"
    - ".yamllint.yaml"
    - ".reviewdog.yml"
    - ".github/workflows/**"
  merge_group:
  push:
    branches:
    - main
    paths:
    - "src/**"
    - "tests/**"
    - "cmake/**"
    - "android/**"
    - "browser/**"
    - "data/**"
    - "mods/**"
    - "modules/**"
    - "tools/**"
    - "vc18/**"
    - "vcpkg.json"
    - "vcpkg-configuration.json"
    - "overlay-ports/**"
    - "CMakeLists.txt"
    - "CMakePresets.json"
    - "Dockerfile"
    - "Dockerfile.browser"
    - "Dockerfile.browser.sh"
    - "build_luajit_android.sh"
    - "setup_android_deps.sh"
    - "init.lua"
    - "otclientrc.lua"
    - "cacert.pem"
    - "config.ini"
    - ".dockerignore"
    - ".yamllint.yaml"
    - ".reviewdog.yml"
    - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      compile: ${{ ('push' == 'workflow_dispatch' || 'push' == 'merge_group') && 'true' || steps.filter.outputs.compile }}
      macos: ${{ ('push' == 'workflow_dispatch' || 'push' == 'merge_group') && 'true' || steps.filter.outputs.macos }}
      android: ${{ ('push' == 'workflow_dispatch' || 'push' == 'merge_group') && 'true' || steps.filter.outputs.android }}
      docker: ${{ ('push' == 'workflow_dispatch' || 'push' == 'merge_group') && 'true' || steps.filter.outputs.docker }}
      browser: ${{ ('push' == 'workflow_dispatch' || 'push' == 'merge_group') && 'true' || steps.filter.outputs.browser }}
    steps:
    - name: Checkout repository
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 0
    - name: Detect changed paths
      id: filter
      if: ${{ 'push' != 'workflow_dispatch' && 'push' != 'merge_group' }}
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
      with:
        filters: |
          compile:
            - "src/**"
            - "tests/**"
            - "cmake/**"
            - "vc18/**"
            - "vcpkg.json"
            - "vcpkg-configuration.json"
            - "overlay-ports/**"
            - "CMakeLists.txt"
            - "CMakePresets.json"
            - ".yamllint.yaml"
            - ".reviewdog.yml"
            - ".github/workflows/ci.yml"
            - ".github/workflows/reusable-build-linux.yml"
            - ".github/workflows/reusable-build-windows.yml"
            - ".github/workflows/reusable-checks.yml"
            - ".github/workflows/reusable-tests-lua.yml"
            - ".github/workflows/update_vcpkg_baseline.yml"
          macos:
            - "src/**"
            - "cmake/**"
            - "vcpkg.json"
            - "vcpkg-configuration.json"
            - "overlay-ports/**"
            - "CMakeLists.txt"
            - "CMakePresets.json"
            - ".github/workflows/ci.yml"
            - ".github/workflows/reusable-build-macos.yml"
            - ".github/workflows/update_vcpkg_baseline.yml"
          android:
            - "src/**"
            - "android/**"
            - "cmake/**"
            - "CMakeLists.txt"
            - "vcpkg.json"
            - "vcpkg-configuration.json"
            - "overlay-ports/**"
            - "build_luajit_android.sh"
            - "setup_android_deps.sh"
            - ".github/workflows/ci.yml"
            - ".github/workflows/reusable-build-android-apk.yml"
            - ".github/workflows/update_vcpkg_baseline.yml"
          docker:
            - "Dockerfile"
            - ".dockerignore"
            - "src/**"
            - "cmake/**"
            - "vcpkg.json"
            - "vcpkg-configuration.json"
            - "overlay-ports/**"
            - "CMakeLists.txt"
            - "CMakePresets.json"
            - ".yamllint.yaml"
            - ".github/workflows/ci.yml"
            - ".github/workflows/reusable-build-docker.yml"
            - ".github/workflows/update_vcpkg_baseline.yml"
          browser:
            - "Dockerfile.browser"
            - "Dockerfile.browser.sh"
            - "browser/**"
            - "src/**"
            - "cmake/**"
            - "vcpkg.json"
            - "vcpkg-configuration.json"
            - "overlay-ports/**"
            - "CMakeLists.txt"
            - ".yamllint.yaml"
            - ".github/workflows/ci.yml"
            - ".github/workflows/reusable-build-browser.yml"
            - ".github/workflows/update_vcpkg_baseline.yml"

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  checks:
    name: Fast Checks
    if: ${{ 'push' != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      checks: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/reusable-checks.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  tests-lua:
    name: Lua Syntax
    if: ${{ 'push' != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-tests-lua.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  build-linux:
    name: Build - Linux
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && ('push' != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  build-android-apk:
    name: Build - Android APK
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.android == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && ('push' != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/reusable-build-android-apk.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit

  build-docker:
    name: Build - Docker
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.docker == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && ('push' != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-docker.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
      push: ${{ 'push' == 'push' && github.ref == 'refs/heads/main' }}
      vcpkg_binary_cache_access: ${{ 'push' == 'push' && github.ref == 'refs/heads/main' && 'readwrite' || 'read' }}
    secrets: inherit

  build-browser:
    name: Build - Browser
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.browser == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && ('push' != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-build-browser.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
    secrets: inherit
