name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, forwarded by the caller"
        type: string
        default: ""
      push:
        description: Publish the Docker image to GHCR.
        required: false
        type: boolean
        default: false
      vcpkg_binary_cache_access:
        description: vcpkg binary cache access mode. Use readwrite only for trusted publishing events.
        required: false
        type: string
        default: read

permissions:
  contents: read
  packages: write
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  build:
    name: Image Build
    runs-on: ubuntu-latest
    env:
      DOCKER_PUBLISH_CONTEXT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'opentibiabr/otclient' && 'true' || 'false' }}
      DOCKER_PUBLISH: ${{ inputs.push && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'opentibiabr/otclient' && secrets.VCPKG_PACKAGES_TOKEN != '' && 'true' || 'false' }}
      VCPKG_BINARY_CACHE_ACCESS: ${{ inputs.vcpkg_binary_cache_access == 'readwrite' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'opentibiabr/otclient' && secrets.VCPKG_PACKAGES_TOKEN != '' && 'readwrite' || 'read' }}
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          fetch-depth: 0
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Convert repository name to lowercase
        id: repo_lower
        shell: bash
        run: echo "value=${REPO,,}" >> "${GITHUB_OUTPUT}"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warn when Docker publishing is disabled
        if: inputs.push && env.DOCKER_PUBLISH != 'true'
        shell: bash
        run: |
          if [ "${DOCKER_PUBLISH_CONTEXT}" != "true" ]; then
            echo "::warning::Docker publishing was requested outside the opentibiabr/otclient push-to-main context; building without publishing."
          else
            echo "::warning::Docker publishing was requested, but VCPKG_PACKAGES_TOKEN is not configured; building without publishing."
          fi

      - name: Login to GHCR
        if: env.DOCKER_PUBLISH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.VCPKG_PACKAGES_TOKEN }}

      - name: Build and push
        if: env.DOCKER_PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VCPKG_FEED_URL=https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
            VCPKG_FEED_USERNAME=${{ github.repository_owner }}
            VCPKG_BINARY_CACHE_ACCESS=${{ env.VCPKG_BINARY_CACHE_ACCESS }}
            VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,${{ env.VCPKG_BINARY_CACHE_ACCESS }};nugettimeout,1200
          secrets: |
            github_token=${{ secrets.VCPKG_PACKAGES_TOKEN || github.token }}
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.value }}:latest
            ghcr.io/${{ steps.repo_lower.outputs.value }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and export
        if: env.DOCKER_PUBLISH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          outputs: type=local,dest=artifacts/docker-rootfs
          build-args: |
            VCPKG_FEED_URL=https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
            VCPKG_FEED_USERNAME=${{ github.repository_owner }}
            VCPKG_BINARY_CACHE_ACCESS=${{ env.VCPKG_BINARY_CACHE_ACCESS }}
            VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,${{ env.VCPKG_BINARY_CACHE_ACCESS }};nugettimeout,1200
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.value }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload docker artifact
        if: env.DOCKER_PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docker-otclient
          path: artifacts/docker-rootfs/otclient/
          retention-days: 7
